---
name: 'ci'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  site:
    name: 'Starter site'
    runs-on: 'ubuntu-latest'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unused dependencies
        run: npm run test:deps

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan (axe, light + dark)
        run: npm run test:a11y

  cli:
    name: 'CLI tests'
    runs-on: 'ubuntu-latest'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:cli

  presets:
    name: 'Preset: ${{ matrix.preset }} (${{ matrix.launcher }})'
    runs-on: 'ubuntu-latest'

    strategy:
      fail-fast: false
      matrix:
        preset: ['full', 'blog', 'portfolio', 'minimal', 'barebones']
        launcher: ['launcher', 'no-launcher']

    env:
      SITE_DIR: ${{ github.workspace }}/../preset-site
      ACCESSIBLE_ASTRO_STARTER_TEMPLATE_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Scaffold preset
        run: >-
          node packages/create-accessible-astro-starter/dist/src/index.js "$SITE_DIR"
          --preset ${{ matrix.preset }} --${{ matrix.launcher }} --yes

      - name: Unused dependencies
        run: node packages/qa/scripts/check-unused-deps.mjs "$SITE_DIR"

      - name: Install and build scaffolded site
        working-directory: ${{ env.SITE_DIR }}
        run: npm install && npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan (axe, light + dark)
        run: node packages/qa/scripts/a11y-scan.mjs "$SITE_DIR/dist"
